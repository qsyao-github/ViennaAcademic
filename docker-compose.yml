services:
  scipy-light:
    build: ./scipy-light
    image: scipy-light
    container_name: scipy-light
    networks:
      - vienna_net

  vienna_gpu:
    build: ./
    container_name: vienna_gpu
    volumes:
      - ./:/root/ViennaAcademic
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - scipy-light
    networks:
      - vienna_net

networks:
  vienna_net:
    driver: bridge
